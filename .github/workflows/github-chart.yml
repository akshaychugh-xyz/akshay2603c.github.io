name: Update GitHub Contribution Chart

on:
  schedule:
    # Daily at 03:17 UTC — off the hour, since GitHub delays runs scheduled on it.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-chart
  cancel-in-progress: true

jobs:
  build-chart:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build contribution chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/build-github-chart.js

      - name: Commit chart if it changed
        run: |
          if git diff --quiet -- assets/images/github-contributions.svg; then
            echo "Contribution chart is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/github-contributions.svg
          git commit -m "chore: refresh GitHub contribution chart"
          git push
