- date: 2026-09-10
  title: "The three squares in the corners of every QR code use a fixed 1:1:3:1:1 black-white ratio - picked in 1994 by measuring stacks of magazines and boxes to find the one pattern that almost never shows up in normal print, so a scanner locks on instantly and never mistakes a busy cereal box for a code"
  details: |
    That 1:1:3:1:1 rule is why the ratio survives no matter how you rotate the code - scan a line through any of the three corner squares from any angle, and you hit black-white-black-white-black in that same proportion. The scanner isn't looking for a shape, it's looking for that rhythm, and the 1994 team chose it precisely because it's rare in ordinary print.

    The other half of the magic is error correction. A QR code carries so much backup data that you can tear, smudge, or cover up to ~30% of it and it still scans - which is exactly how a brand stamps its logo in the middle without breaking the code.

- date: 2026-09-05
  title: "The Cmd+Tab switcher only ever lists 'Regular' apps - which is why menu-bar utilities like Rectangle or 1Password's helper run the whole time but never show up when you tab through. macOS lets an app declare itself an *Accessory* and stay invisible instead"
  details: |
    Every Mac app declares an *activation policy* with three tiers. **Regular** apps show up in the Dock and Cmd+Tab, like Safari or VS Code. **Accessory** apps still put windows on screen, keep a menu-bar icon, and answer global hotkeys, but they never touch the Dock or the switcher. **Prohibited** apps have no UI at all.

    An app sets its tier one of two ways: a flag in its Info.plist (`LSUIElement = true`) at build time, or one line at launch (`setActivationPolicy(.accessory)`). Some ship as Regular so you can find them during onboarding, then quietly demote themselves once they've settled into the menu bar.

    I went down this hole trying to hide fns, a little Vim-scroll utility, from my switcher. Editing the Info.plist breaks the app's code signature, so it won't launch until you re-sign it. And even then, macOS won't let you touch a signed app inside /Applications at all - you just get "Operation not permitted", no password prompt, no explanation. That's App Management protection, added in Ventura: only an app Apple has blessed, or one you've whitelisted in Privacy settings, can modify another app's bundle.

- date: 2026-06-12
  title: "[Sturgeon's Law](https://en.wikipedia.org/wiki/Sturgeon%27s_law) - '90% of everything is crap' - was coined by a 1950s sci-fi writer as a *defence* of his genre, not a put-down"
  details: |
    Critics kept saying almost all of sci-fi was crap. As a defence, Theodore Sturgeon conceded and went bigger: 90% of films, books, and companies is crap too. But you judge a field, or even your own output, by the 10% where the magic happens.

    The 90% crap is the price you pay for the magic of the 10%. It also means you have to put in the time to get the 90% crap out before you reach the 10% magic.

